name: Build Fabric mod
on:
  push:
    branches: ['arena/7632548b-sigma-chan-repesitory', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and production JAR
        run: ./gradlew build --no-daemon --stacktrace
      - name: Inspect resources
        run: python3 tools/validate_resources.py
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-companions-mc1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Dedicated server smoke test
        run: python3 tools/server_smoke.py