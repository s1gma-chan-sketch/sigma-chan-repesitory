name: Build Fabric mod
on:
  push:
    branches: ['arena/7632548b-sigma-chan-repesitory', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and production JAR
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > build-ci.log 2>&1
          result=$?
          tail -100 build-ci.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
            from pathlib import Path
            lines = [line for line in Path('build-ci.log').read_text().splitlines() if 'error:' in line or 'FAILED' in line or 'Caused by:' in line or 'Could not' in line]
            for line in lines[:35]:
                print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
            PY
          fi
          exit "$result"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-ci.log
            build/reports/tests/test/
      - name: Inspect resources
        run: python3 tools/validate_resources.py
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-companions-mc1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Dedicated server smoke test
        run: python3 tools/server_smoke.py