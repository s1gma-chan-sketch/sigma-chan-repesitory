name: Build Fabric mod
on:
  push:
    branches: ['arena/7632548b-sigma-chan-repesitory', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and production JAR
        run: |
          if ./gradlew build --no-daemon --stacktrace > build-ci.log 2>&1; then
            tail -30 build-ci.log
          else
            tail -100 build-ci.log
            grep -A 3 -E 'error:|FAILED|Caused by:|Could not' build-ci.log | head -100 | tr '\n' ' ' | sed 's/-- /\n/g;s/^/::error::/' || true
            python3 -c 'import pathlib,xml.etree.ElementTree as E; [(print("::error::"+str(f)+" "+x.attrib.get("message",""))) for f in pathlib.Path("build/test-results/test").glob("*.xml") for x in E.parse(f).iter() if x.tag in ("failure","error")]' || true
            exit 1
          fi
      - name: Publish readable build diagnostics
        if: failure() && hashFiles('build-ci.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST -f encoding=base64 -f content="$(base64 -w0 build-ci.log)" --jq .sha)
          echo "::notice::BUILD_LOG_BLOB=${blob}"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-ci.log
            build/reports/tests/test/
      - name: Inspect production JAR
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          def require(condition, message):
              if not condition:
                  print('::error::JAR inspection: ' + message)
                  raise SystemExit(1)
          jars = [p for p in pathlib.Path('build/libs').glob('*.jar') if not p.name.endswith('-sources.jar')]
          require(len(jars) == 1, f'expected one production jar, got {jars}')
          jar = jars[0]
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              require(z.testzip() is None, 'corrupt zip entry')
              for entry in ('fabric.mod.json', 'sigma_companions.client.mixins.json', 'client-sigma_companions.refmap.json', 'dev/sigmachan/companions/client/mixin/HeldItemRendererMixin.class'):
                  require(entry in names, f'missing {entry}; mixin/refmap entries={[n for n in sorted(names) if "mixin" in n or "refmap" in n]}')
              require(not any(n.startswith('dev/sigmachan/companions/') and n.endswith('Test.class') for n in names), 'test classes in production jar')
          print(jar.name, jar.stat().st_size, hashlib.sha256(jar.read_bytes()).hexdigest())
          PY
      - name: Inspect resources
        run: python3 tools/validate_resources.py
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-companions-mc1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Dedicated server smoke test
        run: python3 tools/server_smoke.py
      - name: Upload server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-diagnostics
          path: |
            run/smoke.log
            run/logs/latest.log
      - name: Publish readable smoke diagnostics
        if: failure() && hashFiles('run/smoke.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST -f encoding=base64 -f content="$(base64 -w0 run/smoke.log)" --jq .sha)
          echo "::notice::SMOKE_LOG_BLOB=${blob}"
      - name: Attach JAR to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            jar=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -1)
            sha256sum "$jar"
            blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST -f encoding=base64 -f content="$(base64 -w0 "$jar")" --jq .sha)
            if ! [[ "$blob" =~ ^[0-9a-f]{40}$ ]]; then echo "Invalid JAR blob response: $blob"; exit 1; fi
            hash=$(sha256sum "$jar" | awk '{print $1}')
            echo "::notice::VERIFIED_JAR_BLOB=${blob}"
            echo "VERIFIED_JAR_BLOB=${blob}" >> "$GITHUB_STEP_SUMMARY"
            tag="build-${GITHUB_RUN_ID}"
            notes="Fabric 1.21.1 alpha: Lucky Star fan companions, friendship-only gestures, abstract needs. Unit tests and dedicated-server smoke test passed. Download the JAR below, not the source archives. Draft prerelease: not a stable release. VERIFIED_JAR_BLOB=${blob} SHA256=${hash}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes "$notes"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "Sigma Companions 0.2.0 — verified alpha build" --notes "$notes" --draft --prerelease
            fi
            gh release upload "$tag" "$jar" --clobber
          } > attach.log 2>&1
          code=$?
          cat attach.log
          if [ "$code" -ne 0 ]; then
            logblob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST -f encoding=base64 -f content="$(base64 -w0 attach.log)" --jq .sha || true)
            echo "::error::ATTACH_LOG_BLOB=${logblob}"
            exit "$code"
          fi